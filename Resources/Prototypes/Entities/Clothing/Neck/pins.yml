- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckPinBase
  abstract: true
  name: pin
  description: Be nothing do crime.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Clothing/Neck/Misc/pins.rsi
  - type: Clothing
    sprite: Clothing/Neck/Misc/pins.rsi
    tags:
    - ClothMade #idk man its on the parent
    - MonkeyWearable
    - WhitelistChameleon

- type: entity
  parent: ClothingNeckPinBase
  id: ClothingNeckAutismPin
  name: neurodivergent pin
  description: Be neurodivergent, do crime.
  components:
  - type: Sprite
    state: autism
  - type: Clothing
    equippedPrefix: autism

- type: entity
  parent: ClothingNeckPinBase
  id: ClothingNeckGoldAutismPin
  name: autism pin
  description: Be autistic, do crime.
  components:
  - type: Sprite
    state: goldautism
  - type: Clothing
    equippedPrefix: goldautism

- type: entity
  parent: [SolutionSpray, SolutionTiny, BaseItem]
  id: SprayFlowerPin
  name: flower pin
  description: A cute flower pin. Something seems off with it...
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Clothing/Neck/Misc/pins.rsi
    state: flower
  - type: Clothing
    equippedPrefix: flower
    sprite: Clothing/Neck/Misc/pins.rsi
    quickEquip: true
    slots:
    - neck
  - type: EquipSpray
    verbLocId: equip-spray-verb-press
  - type: Solution
    solution:
      reagents:
      - ReagentId: Water
        Quantity: 30
  - type: RefillableSolution
    solution: spray
  - type: DrainableSolution
    solution: spray
  - type: SolutionTransfer
    maxTransferAmount: 30
    transferAmount: 30
  - type: UseDelay
  - type: Spray
    transferAmount: 5
    pushbackAmount: 30
    spraySound:
      path: /Audio/Effects/spray3.ogg
    sprayedPrototype: FlowerVapor
    vaporAmount: 1
    vaporSpread: 90
    sprayVelocity: 1.0
    sprayEmptyPopupMessage: pin-spray-popup-empty
  - type: ActionGrant
    actions:
    - ActionShootWater
  - type: ItemActionGrant
    activeIfWorn: true
