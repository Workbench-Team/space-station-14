- type: entity
  name: raw gondola meat
  parent: FoodMeatBase
  id: FoodMeatGondola
  description: A raw piece of gondola. Stinky.
  components:
  - type: Tag
    tags:
    - Raw
  - type: Sprite
    sprite: Starshine/Objects/Consumable/Food/meat.rsi
    state: gondola
  - type: FlavorProfile
    flavors:
      - shocking
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 10
        - ReagentId: Fat
          Quantity: 5
        - ReagentId: Toxin
          Quantity: 5

- type: entity
  name: mimic flesh
  parent: FoodMeatBase
  id: FoodMeatMimic
  description: Imitates even after death...
  components:
  - type: Tag
    tags:
    - Raw
    - Meat
  - type: Sprite
    state: rotten
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Carbon
          Quantity: 2
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Carbon
        Quantity: 2
