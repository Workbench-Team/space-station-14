- type: entity
  name: nutriment medipen
  parent: ChemicalMedipen
  id: NutrimentMedipen
  description: A single-use medipen containing nutriment.
  components:
  - type: Tag
    tags: [AutoInjector]
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    layers:
    - state: salacid
      map: [ "enum.SolutionContainerLayers.Fill" ]
  - type: Item
    sprite: Objects/Specific/Medical/medipen.rsi
    size: Tiny
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: salacid_empty
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 30
        reagents:
        - ReagentId: Nutriment
          Quantity: 30
  - type: Hypospray
    solutionName: pen
    transferAmount: 10
  - type: StaticPrice
    price: 250

