- type: entity
  name: explosion package
  description: A special explosive device for storming premises.
  parent: BasePlasticExplosive
  id: ExplosionPackage
  components:
  - type: Sprite
    sprite: Starshine/Objects/Weapons/Bombs/explosion_package.rsi
    state: icon
    layers:
    - state: icon
      map: ["base"]
  - type: Item
    sprite: Starshine/Objects/Weapons/Bombs/explosion_package.rsi
    size: Small
  - type: TriggerOnActivate
  - type: TriggerOnSignal
  - type: TriggerOnStuck
    keyOut: stuck
  - type: ToggleTriggerCondition # for toggling the start on stuck ability
    keys:
    - stuck
    toggleVerb: toggle-trigger-condition-stick-verb
    toggleOn: toggle-trigger-condition-stick-on
    toggleOff: toggle-trigger-condition-stick-off
  - type: TimerTrigger
    keysIn:
    - trigger
    - stuck
    delay: 5
    delayOptions: [5, 10, 15, 20, 30]
    initialBeepDelay: 0
    beepSound: /Audio/Machines/Nuke/general_beep.ogg
  - type: DeviceLinkSink
    ports:
      - Trigger
  - type: Explosive # Powerful explosion in a very small radius. Doesn't break underplating.
    explosionType: DemolitionCharge
    totalIntensity: 15
    intensitySlope: 20
    maxIntensity: 20
    canCreateVacuum: false
  - type: ExplodeOnTrigger
    keysIn:
    - timer
