- type: entity
  id: LockerBaseStarshine
  parent: LockerBase
  abstract: true
  components:
  - type: Sprite
    sprite: Starshine/Structures/Storage/closet.rsi

- type: entity
  id: LockerMiner
  parent: LockerBaseStarshine
  name: salvage specialist's equipment
  description: Nevermind the pickaxe.
  components:
  - type: Appearance
  - type: EntityStorageVisuals
    stateBaseClosed: shaftminer
    stateDoorOpen: shaftminer_open
    stateDoorClosed: shaftminer_door
  - type: AccessReader
    access: [["Salvage"]]

