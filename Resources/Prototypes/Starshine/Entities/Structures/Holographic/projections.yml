- type: entity
  id: HoloFanTram
  parent: HoloFan
  name: tram atmos barrier
  description: A barrier of hard light that blocks air, but nothing else.
  components:
  - type: Sprite
    sprite: Structures/Holo/atmos_tram.rsi
    state: icon
    netsync: false

- type: entity
  id: HolosignEngineering
  parent: HolosignWetFloor
  name: holobarrier
  description: A short holographic barrier which can only be passed by walking.
  components:
    - type: Physics
      bodyType: Static
      canCollide: true
    - type: Sprite
      sprite: Structures/Holo/engi.rsi
      state: icon
      netsync: false
    - type: Fixtures
      fixtures:
        fix1:
          hard: false
          density: 7
          shape:
            !type:PhysShapeAabb
            bounds: "-0.5,-0.5,0.5,0.5"
          layer:
            - MidImpassable
    - type: AtmosExposed
    - type: SpeedModifierContacts
      walkSpeedModifier: 1
      sprintSpeedModifier: 0.0
    - type: Clickable
    - type: Damageable
      damageModifierSet: Holosign
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 70
        behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
