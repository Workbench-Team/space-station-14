#Brigmedic hardsuit
- type: entity
  id: SuitStorageBrigmedic
  parent: SuitStorageBase
  suffix: Brigmedic
  components:
  - type: StorageFill
    contents:
        - id: NitrogenTankFilled
        - id: OxygenTankFilled
        - id: ClothingOuterHardsuitBrigmedic
        - id: ClothingMaskBreath
