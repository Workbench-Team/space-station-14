- type: entity
  name: plastic bottle box
  parent: BoxCardboardStarshine
  id: BoxPlasticBottle
  description: A box full of plastic bottles.
  components:
  - type: Storage
    grid:
    - 0,0,3,2
    maxItemSize: Normal
  - type: StorageFill
    contents:
      - id: SmallBottle
        amount: 2
      - id: LargeBottle
        amount: 2
  - type: Sprite
    layers:
      - state: box
        sprite: Objects/Storage/boxes.rsi
      - state: bottleplastic
