- type: entity
  abstract: true
  parent: BoxCardboard
  id: BoxCardboardStarshine
  components:
    - type: Sprite
      sprite: Starshine/Objects/Storage/boxes.rsi

- type: entity
  name: miner artifact
  parent: BoxCardboardStarshine
  id: BoxArtifactMiners
  description: This box is filled with mousetraps. Try not to get your hand stuck in one.
  components:
  - type: Sprite
    layers:
      - state: box_of_doom
        sprite: Objects/Storage/boxes.rsi
      - state: heart_black

- type: entity
  name: box of magazines
  parent: BoxArtifactMiners
  id: BoxCursedKatana
  description: A box full of medpens.
  components:
  - type: StorageFill
    contents:
      - id: KatanacursedShard
      - id: ClothingOuterDogi
  - type: Storage
    maxItemSize: Normal

- type: entity
  name: A.M.R.E.
  parent: BoxCardboardStarshine
  id: BoxAMRE
  description: A box of new generation army rations.
  components:
  - type: StorageFill
    contents:
      - id: SalineMedipen
        amount: 3
      - id: NutrimentMedipen
        amount: 3
  - type: Sprite
    layers:
      - state: box_olive
        sprite: Objects/Storage/boxes.rsi
      - state: dna
